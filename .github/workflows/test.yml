# The release workflow calls this workflow with `ref` set to the tag.
name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_call:
    inputs:
      ref:
        description: the commit to test
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  FIRECRACKER_VERSION: v1.17.0
  BUILDKIT_VERSION: v0.33.1
  BUILDKIT_SHA256: >-
    4e044bcd62a0c0bbe6a8c94d73989de2bfe4c04dbc0f9d6021cf96b72cd1d965

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make guest
      - run: go vet ./...
      - run: go test ./...

  cage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Give the runner user access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle
          test -w /dev/kvm
      - name: Install the host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex \
            libelf-dev libssl-dev nfs-kernel-server nftables xz-utils
      - name: Install Firecracker
        run: |
          release="https://github.com/firecracker-microvm/firecracker"
          release+="/releases/download/$FIRECRACKER_VERSION"
          suffix="$FIRECRACKER_VERSION-x86_64"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$release/firecracker-$suffix.tgz"
          curl -fsSLO "$release/firecracker-$suffix.tgz.sha256.txt"
          sha256sum -c "firecracker-$suffix.tgz.sha256.txt"
          tar -xzf "firecracker-$suffix.tgz"
          sudo install -m 0755 "release-$suffix/firecracker-$suffix" \
            /usr/local/bin/firecracker
      - name: Start BuildKit
        run: |
          archive="buildkit-$BUILDKIT_VERSION.linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          release="https://github.com/moby/buildkit/releases/download"
          curl -fsSLO "$release/$BUILDKIT_VERSION/$archive"
          echo "$BUILDKIT_SHA256  $archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local
          sudo mkdir -p /run/buildkit
          sudo nohup buildkitd --group "$(id -gn)" \
            > "$RUNNER_TEMP/buildkitd.log" 2>&1 &
          for _ in $(seq 30); do
            test -S /run/buildkit/buildkitd.sock && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/buildkitd.log"
          exit 1
      - name: Restore the guest kernel
        uses: actions/cache@v6
        with:
          path: |
            images/kernel/linux-amd64.gz
            images/kernel/version
          key: kernel-amd64-${{ hashFiles('kernel/**') }}
      - run: make build
      - run: bin/prison doctor || true
      - run: make test-cage
