# Releases only the tags whose commit is on `prod`, after their tests pass.
name: release

on:
  push:
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "the tag name has unsafe characters. Skipped"
            echo 'tag=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --force origin prod:refs/remotes/origin/prod; then
            echo "the prod branch does not exist"
            echo 'tag=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/prod; then
            echo "$GITHUB_REF_NAME is not on prod. Skipped"
            echo 'tag=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  test:
    needs: select
    if: needs.select.outputs.tag != ''
    uses: ./.github/workflows/test.yml
    with:
      ref: refs/tags/${{ needs.select.outputs.tag }}

  build:
    needs: [select, test]
    if: needs.select.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: macos-15, goos: darwin, goarch: arm64 }
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
    runs-on: ${{ matrix.platform.runner }}
    env:
      TAG: ${{ needs.select.outputs.tag }}
      ARCHIVE: >-
        prison-${{ needs.select.outputs.tag }}-${{ matrix.platform.goos }}-${{
        matrix.platform.goarch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.select.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install the kernel build tools
        if: matrix.platform.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex \
            libelf-dev libssl-dev xz-utils
      - name: Restore the guest kernel
        if: matrix.platform.goos == 'linux'
        uses: actions/cache@v6
        with:
          path: |
            images/kernel/linux-${{ matrix.platform.goarch }}.gz
            images/kernel/version
          key: >-
            kernel-${{ matrix.platform.goarch }}-${{
            hashFiles('kernel/**') }}
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make build VERSION="$TAG"
      - name: Package
        run: |
          mkdir -p "dist/$ARCHIVE"
          cp bin/prison LICENSE README.md "dist/$ARCHIVE/"
          tar -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          cd dist
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/${{ env.ARCHIVE }}.tar.gz
            dist/${{ env.ARCHIVE }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [select, test, build]
    if: needs.select.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: prison-${{ needs.select.outputs.tag }}-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.select.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes \
              --title "$TAG"
          fi
          gh release upload "$TAG" dist/* --clobber

  homebrew:
    needs: [select, release]
    if: needs.select.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: prison-${{ needs.select.outputs.tag }}-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          repository: gjazali/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update Formula/prison.rb
        env:
          TAG: ${{ needs.select.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DARWIN_ARM64_SHA="$(awk '{print $1}' "dist/prison-${TAG}-darwin-arm64.tar.gz.sha256")"
          LINUX_AMD64_SHA="$(awk '{print $1}' "dist/prison-${TAG}-linux-amd64.tar.gz.sha256")"
          LINUX_ARM64_SHA="$(awk '{print $1}' "dist/prison-${TAG}-linux-arm64.tar.gz.sha256")"

          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/prison.rb <<EOF
          class Prison < Formula
            desc "Run processes in a per-project micro-VM, isolated from your machine"
            homepage "https://github.com/gjazali/prison"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/gjazali/prison/releases/download/${TAG}/prison-${TAG}-darwin-arm64.tar.gz"
                sha256 "${DARWIN_ARM64_SHA}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/gjazali/prison/releases/download/${TAG}/prison-${TAG}-linux-amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
              on_arm do
                url "https://github.com/gjazali/prison/releases/download/${TAG}/prison-${TAG}-linux-arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              end
            end

            def install
              bin.install "prison"
            end

            def caveats
              if OS.mac?
                <<~EOS
                  Prison requires Apple's Container runtime on macOS:
                    brew install container
                    container system start --enable-kernel-install
                EOS
              else
                <<~EOS
                  Prison on Linux requires KVM (/dev/kvm), Firecracker, BuildKit,
                  nfs-kernel-server, and nftables. Run \`prison doctor\` to check setup.
                EOS
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/prison --version")
            end
          end
          EOF

          cd homebrew-tap
          if git diff --quiet Formula/prison.rb; then
            echo "Formula/prison.rb is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/prison.rb
          git commit -m "prison ${VERSION}"
          git push
