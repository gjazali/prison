# Claude Code inmate plugin.

[inmate]
name = "claude"
description = "Claude Code, Anthropic's CLI"

[image]
dockerfile = "Dockerfile"

[command]
run = "claude"
unsafe = "claude --dangerously-skip-permissions"

[auth]
upstream = "api.anthropic.com"
path_prefix = "/v1/"
base_url_variable = "ANTHROPIC_BASE_URL"

# `ANTHROPIC_API_KEY` (not `ANTHROPIC_AUTH_TOKEN`) so Claude Code uses it
# for feature flags too. Setting both causes a session warning.
token_variable = "ANTHROPIC_API_KEY"

[[auth.credentials]]
variable = "ANTHROPIC_API_KEY"
header = "x-api-key"

[[auth.credentials]]
variable = "CLAUDE_CODE_OAUTH_TOKEN"
header = "Authorization"
prefix = "Bearer "

[persist]
# `CLAUDE_CONFIG_DIR` puts all config and telemetry in one persisted
# directory, so recreated boxes keep onboarding state and history.
paths = ["/home/dev/.claude"]

[environment]
CLAUDE_CONFIG_DIR = "/home/dev/.claude"

[egress]
hosts = ["api.anthropic.com"]

[host]
copy = ["CLAUDE.md", "agents/", "skills/"]

[[host.json]]
# The settings carried into the box. Every other key is dropped.
from = "settings.json"
to = "settings.json"
keep = ["model", "theme", "effortLevel", "outputStyle",
        "permissions", "includeCoAuthoredBy",
        "alwaysThinkingEnabled", "spinnerVerbs"]

[[host.json]]
# Approve the placeholder key the box is given as `ANTHROPIC_API_KEY`, so
# the session does not open on a prompt about an unrecognised key. Claude
# Code records the last twenty characters, which is what the placeholder
# tail is.
to = ".claude.json"
append = { "customApiKeyResponses.approved" = "${placeholder_tail}" }

[[host.environment]]
name = "CLAUDE_CODE_ACCOUNT_UUID"
from = "~/.claude.json"
path = "oauthAccount.accountUuid"
pattern = "^[0-9a-fA-F-]{1,64}$"

[[host.environment]]
name = "CLAUDE_CODE_ORGANIZATION_UUID"
from = "~/.claude.json"
path = "oauthAccount.organizationUuid"
pattern = "^[0-9a-fA-F-]{1,64}$"
